services:
  relay:
    build: .
    # Not published to the host at all - Caddy (below) is the only public
    # entrypoint, reaching this over the internal compose network instead.
    # 0.0.0.0:PORT and 127.0.0.1:PORT can't both be bound on the same host
    # port at once (0.0.0.0 encompasses loopback), so Caddy's host-facing
    # bind and a loopback-only bind here would conflict outright.
    expose:
      - "4000"
      - "4003"
    volumes:
      - ${CONFIG_BASE_FOLDER:?set CONFIG_BASE_FOLDER in .env}/getbased-relay/relay-data:/data
      - ${CONFIG_BASE_FOLDER:?set CONFIG_BASE_FOLDER in .env}/getbased-relay/context-verifier-socket:/run/getbased-verifier
    environment:
      - RELAY_PORT=4000
      - ADMIN_PORT=4002
      - SELF_PORT=4003
      - SELF_BIND=0.0.0.0
      - SELF_ENABLED=true
      - CONTEXT_VERIFIER_ENABLED=true
      - CONTEXT_VERIFIER_SOCKET=/run/getbased-verifier/verifier.sock
      - CONTEXT_VERIFIER_TOKEN=${CONTEXT_VERIFIER_TOKEN:?set CONTEXT_VERIFIER_TOKEN in .env}
      - QUOTA_PER_OWNER_MB=10
      - QUOTA_GLOBAL_MB=1000
      - LOG_FORMAT=json
      - LOG_LEVEL=info
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4002/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  context-gateway:
    build: ./context-gateway
    ports:
      # Bind the host side to loopback; Caddy/reverse proxy should be the
      # only public entrypoint. CONTEXT_BIND remains 0.0.0.0 so Docker can
      # reach the service inside the container network.
      - "127.0.0.1:4001:4001"
    volumes:
      - ${CONFIG_BASE_FOLDER:?set CONFIG_BASE_FOLDER in .env}/getbased-relay/context-data:/opt/context-gateway/data
      - ${CONFIG_BASE_FOLDER:?set CONFIG_BASE_FOLDER in .env}/getbased-relay/context-verifier-socket:/run/getbased-verifier:ro
    environment:
      - CONTEXT_BIND=0.0.0.0
      - CONTEXT_VERIFIER_SOCKET=/run/getbased-verifier/verifier.sock
      - CONTEXT_VERIFIER_TOKEN=${CONTEXT_VERIFIER_TOKEN:?set CONTEXT_VERIFIER_TOKEN in .env}
      # Caddy overwrites this dedicated header from the socket peer. Ordinary
      # X-Forwarded-For is ignored so callers cannot mint rate-limit buckets.
      - CONTEXT_CLIENT_IP_HEADER=x-getbased-client-ip
      - CONTEXT_RATE_LIMIT_PER_MINUTE=300
      - AGENT_CONTEXT_OWNER_QUOTA_BYTES=5242880
      - AGENT_CONTEXT_MAX_PROFILE_BYTES=524288
      - AGENT_CONTEXT_MAX_PROFILES=20
      - AGENT_CONTEXT_MAX_TOKENS=3
    restart: unless-stopped
    init: true
    user: node
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    depends_on:
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # The relay's own ports (above) are loopback-only; this is the actual
      # public entrypoint, terminating TLS in front of both. On-demand
      # (not static per-hostname) internal certs, because Docker's port-NAT
      # means Caddy sees an unpredictable local socket address per
      # connection when there's no SNI (bare-IP access) - a pre-provisioned
      # cert for one declared hostname doesn't match what Caddy actually
      # sees and the handshake fails with a TLS internal_error.
      - "4000:4000"
      - "4003:4003"
    volumes:
      - ${CONFIG_BASE_FOLDER:?set CONFIG_BASE_FOLDER in .env}/getbased-relay/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CONFIG_BASE_FOLDER:?set CONFIG_BASE_FOLDER in .env}/getbased-relay/caddy-data:/data
    depends_on:
      - relay

